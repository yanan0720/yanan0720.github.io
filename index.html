<title>每日站</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root {
    --black:#0a0a0a; --white:#fff; --gray-100:#f7f7f7; --gray-200:#ebebeb;
    --gray-300:#d4d4d4; --gray-400:#a3a3a3; --gray-500:#737373;
    --gray-600:#525252; --gray-700:#404040;
  }
  body {
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--white); color:var(--black);
    min-height:100vh; display:flex; flex-direction:column;
    -webkit-font-smoothing:antialiased;
  }
  .top-bar { display:flex; justify-content:space-between; align-items:center; padding:44px 20px 14px; border-bottom:1px solid var(--gray-200); }
  .top-bar h1 { font-size:19px; font-weight:700; letter-spacing:2px; }
  .top-bar .date { font-size:11px; color:var(--gray-400); }

  .content { flex:1; padding:16px 20px; overflow-y:auto; }

  /* 今日知识点卡片 */
  .knowledge-card {
    background:var(--gray-100); border-radius:16px; padding:20px;
    margin-bottom:20px; animation:fadeIn .4s ease;
  }
  @keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
  .card-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
  .card-tag {
    font-size:11px; padding:3px 10px; border:1px solid var(--black);
    border-radius:12px; letter-spacing:1px;
  }
  .card-progress { font-size:11px; color:var(--gray-400); }
  .card-title { font-size:18px; font-weight:700; margin-bottom:8px; line-height:1.4; }
  .card-body { font-size:14px; color:var(--gray-600); line-height:1.8; }
  .card-body p { margin-bottom:10px; }
  .card-body strong { color:var(--black); }
  .card-body em { font-style:normal; background:linear-gradient(transparent 60%, #ffeaa7 60%); }
  .card-footer { margin-top:14px; padding-top:12px; border-top:1px solid var(--gray-200); display:flex; justify-content:space-between; align-items:center; }
  .card-source { font-size:11px; color:var(--gray-400); }
  .card-actions button {
    background:none; border:1px solid var(--gray-300); border-radius:20px;
    padding:5px 12px; font-size:12px; color:var(--gray-500); cursor:pointer; margin-left:6px;
  }

  /* 刷新提示 */
  .refresh-bar {
    display:flex; justify-content:space-between; align-items:center;
    margin-bottom:14px; font-size:12px; color:var(--gray-400);
  }
  .refresh-bar button {
    background:none; border:1px solid var(--gray-300); border-radius:20px;
    padding:5px 14px; font-size:12px; color:var(--gray-500); cursor:pointer;
  }

  /* 运动区 */
  .section-title { font-size:13px; font-weight:600; color:var(--gray-700); margin:8px 0 14px; letter-spacing:1px; }
  .form-group { margin-bottom:14px; }
  .form-group label { display:block; font-size:12px; color:var(--gray-500); margin-bottom:5px; }
  .form-group input, .form-group select {
    width:100%; padding:11px 14px; border:1px solid var(--gray-200);
    border-radius:10px; font-size:15px; outline:none; background:var(--gray-100);
    -webkit-appearance:none; appearance:none;
  }
  .form-group input:focus, .form-group select:focus { border-color:var(--black); background:var(--white); }
  .form-row { display:flex; gap:10px; }
  .form-row .form-group { flex:1; }
  .btn-primary {
    width:100%; padding:14px; border:none; border-radius:12px;
    background:var(--black); color:var(--white); font-size:15px; font-weight:500;
    letter-spacing:2px; cursor:pointer; margin-top:6px;
  }
  .btn-primary:active { opacity:.7; }

  /* 方案结果 */
  .plan-result { display:none; margin-top:18px; padding:16px; background:var(--gray-100); border-radius:12px; }
  .plan-result.show { display:block; }
  .plan-phase { margin-bottom:12px; }
  .plan-phase .pn { font-weight:600; font-size:14px; margin-bottom:4px; }
  .plan-phase .pd { font-size:13px; color:var(--gray-600); line-height:1.7; }
  .plan-phase .pd a { color:var(--black); text-decoration:underline; word-break:break-all; }

  /* 记录 */
  .chart-box { width:100%; height:180px; margin-bottom:18px; background:var(--gray-100); border-radius:12px; padding:10px; }
  .chart-box canvas { width:100%!important; height:100%!important; }
  .log-list { list-style:none; padding:0; }
  .log-item { padding:11px 0; border-bottom:1px solid var(--gray-200); font-size:13px; color:var(--gray-600); line-height:1.6; }
  .log-item:last-child { border-bottom:none; }
  .log-date { font-size:11px; color:var(--gray-400); }

  /* Tab */
  .tab-bar { display:flex; border-top:1px solid var(--gray-200); background:var(--white); padding:6px 0 18px; }
  .tab-item { flex:1; text-align:center; padding:8px 0; cursor:pointer; font-size:11px; color:var(--gray-400); letter-spacing:.5px; }
  .tab-item.active { color:var(--black); font-weight:600; }
  .tab-item .ti { font-size:20px; display:block; margin-bottom:2px; }

  .page { display:none; }
  .page.active { display:block; }
  .empty-state { text-align:center; padding:40px 20px; color:var(--gray-300); font-size:14px; }
  .empty-state .es-icon { font-size:40px; margin-bottom:12px; }
</style>
</head>
<body>
  <div class="top-bar">
    <h1>每日站</h1>
    <span class="date" id="todayDate"></span>
  </div>

  <div class="content">
    <!-- 学习页 -->
    <div class="page active" id="page-learn">
      <div class="refresh-bar">
        <span id="updateTime">加载中...</span>
        <button onclick="location.reload()">↻ 刷新</button>
      </div>
      <div id="knowledgeContainer">
        <div class="empty-state">
          <div class="es-icon">📖</div>
          <div>正在加载今日知识点...</div>
        </div>
      </div>
    </div>

    <!-- 运动页 -->
    <div class="page" id="page-workout">
      <div class="section-title">今日运动方案</div>
      <div class="form-row">
        <div class="form-group">
          <label>体重(kg)</label>
          <input type="number" id="weight" placeholder="65" step="0.1">
        </div>
        <div class="form-group">
          <label>腰围(cm)</label>
          <input type="number" id="waist" placeholder="80" step="0.1">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>状态(1-5)</label>
          <input type="number" id="energy" placeholder="3" min="1" max="5">
        </div>
        <div class="form-group">
          <label>时长(分钟)</label>
          <input type="number" id="duration" placeholder="30" min="5">
        </div>
      </div>
      <div class="form-group">
        <label>阶段</label>
        <select id="stage">
          <option value="新手">新手 — 低强度入门</option>
          <option value="适应" selected>适应 — 中等强度</option>
          <option value="提升">提升 — 高强度挑战</option>
        </select>
      </div>
      <button class="btn-primary" id="genPlanBtn">生成方案</button>
      <div class="plan-result" id="planResult">
        <div id="planContent"></div>
      </div>
    </div>

    <!-- 记录页 -->
    <div class="page" id="page-record">
      <div class="section-title">身体数据趋势</div>
      <div class="chart-box"><canvas id="trendChart"></canvas></div>
      <div class="section-title">运动日志</div>
      <ul class="log-list" id="logList"></ul>
    </div>
  </div>

  <div class="tab-bar">
    <div class="tab-item active" data-page="learn"><span class="ti">📖</span>学习</div>
    <div class="tab-item" data-page="workout"><span class="ti">🏃</span>运动</div>
    <div class="tab-item" data-page="record"><span class="ti">📊</span>记录</div>
  </div>

  <script>
    // 日期
    document.getElementById('todayDate').textContent = new Date().toLocaleDateString('zh-CN',{month:'short',day:'numeric',weekday:'short'});

    // Tab
    document.querySelectorAll('.tab-item').forEach(t=>{
      t.addEventListener('click',function(){
        document.querySelectorAll('.tab-item').forEach(x=>x.classList.remove('active'));
        this.classList.add('active');
        document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
        document.getElementById('page-'+this.dataset.page).classList.add('active');
        if(this.dataset.page==='record') setTimeout(updateChart,100);
      });
    });

    // 加载知识点
    fetch('data.json?t='+Date.now()).then(r=>r.json()).then(data=>{
      const container=document.getElementById('knowledgeContainer');
      document.getElementById('updateTime').textContent='更新于 '+data.updated_at;
      if(!data.articles||data.articles.length===0){
        container.innerHTML='<div class="empty-state"><div class="es-icon">📭</div><div>今日暂无更新</div></div>';
        return;
      }
      container.innerHTML=data.articles.map((a,i)=>`
        <div class="knowledge-card">
          <div class="card-header">
            <span class="card-tag">${a.category}</span>
            <span class="card-progress">${i+1}/${data.articles.length}</span>
          </div>
          <div class="card-title">${a.title}</div>
          <div class="card-body">${a.content}</div>
          <div class="card-footer">
            <span class="card-source">来源：${a.source||'AI整理'}</span>
            <div class="card-actions">
              <button onclick="this.textContent=this.textContent==='👍'?'已赞':'👍'">👍</button>
              <button onclick="navigator.clipboard.writeText('${a.title}').then(()=>alert('已复制'))">📋</button>
            </div>
          </div>
        </div>
      `).join('');
    }).catch(()=>{
      document.getElementById('knowledgeContainer').innerHTML='<div class="empty-state"><div class="es-icon">⚠️</div><div>加载失败，请检查网络</div></div>';
    });

    // 运动方案
    const planMap={
      '新手':{w:'原地踏步3min + 肩颈环绕2min',m:'靠墙静蹲30s×3\n坐姿抬腿15次×3\n跪姿俯卧撑8次×3',s:'大腿前侧拉伸30s×2\n小腿拉伸30s×2',kw:'无跑跳燃脂站立'},
      '适应':{w:'开合跳(无跳)30次 + 手臂画圈1min',m:'深蹲15次×3\n平板支撑30s×3\n臀桥15次×3',s:'蝴蝶式30s×2\n猫牛式10次\n婴儿式30s',kw:'低冲击有氧跟练'},
      '提升':{w:'弓步压腿每侧10次 + 动态伸展2min',m:'保加利亚分腿蹲每侧10次×3\n俯身划船(弹力带)15次×3\n波比跳(无跳)10次×3',s:'鸽子式30s×2\n腘绳肌拉伸30s×2',kw:'站立HIIT低冲击'}
    };
    document.getElementById('genPlanBtn').addEventListener('click',function(){
      const w=document.getElementById('weight').value.trim();
      const wa=document.getElementById('waist').value.trim();
      const e=document.getElementById('energy').value.trim();
      const d=document.getElementById('duration').value.trim();
      const st=document.getElementById('stage').value;
      if(!w||!wa||!e||!d){alert('请填写完整');return;}
      const logs=JSON.parse(localStorage.getItem('workout_logs')||'[]');
      const now=new Date();
      logs.push({date:now.getFullYear()+'.'+String(now.getMonth()+1).padStart(2,'0')+'.'+String(now.getDate()).padStart(2,'0'),weight:w,waist:wa,energy:e,duration:d,stage:st});
      localStorage.setItem('workout_logs',JSON.stringify(logs));
      const p=planMap[st]||planMap['适应'];
      const sets=Math.max(1,Math.min(4,Math.floor(d/15)));
      const mainAdj=p.m.replace(/×\d+/g,'×'+sets);
      document.getElementById('planContent').innerHTML=`
        <div class="plan-phase"><div class="pn">🔥 热身</div><div class="pd">${p.w}</div></div>
        <div class="plan-phase"><div class="pn">💪 主训练</div><div class="pd">${mainAdj.replace(/\n/g,'<br>')}</div></div>
        <div class="plan-phase"><div class="pn">🧘 拉伸</div><div class="pd">${p.s.replace(/\n/g,'<br>')}</div></div>
        <div class="plan-phase"><div class="pn">🔍 B站搜索</div><div class="pd"><a href="https://search.bilibili.com/all?keyword=${encodeURIComponent(p.kw)}" target="_blank">${p.kw}</a></div></div>
      `;
      document.getElementById('planResult').classList.add('show');
      updateChart();
    });

    // 图表
    function updateChart(){
      const logs=JSON.parse(localStorage.getItem('workout_logs')||'[]');
      const canvas=document.getElementById('trendChart');
      const ctx=canvas.getContext('2d');
      const rect=canvas.parentElement.getBoundingClientRect();
      canvas.width=rect.width*2; canvas.height=rect.height*2;
      canvas.style.width=rect.width+'px'; canvas.style.height=rect.height+'px';
      ctx.scale(2,2);
      const w=rect.width,h=rect.height;
      ctx.clearRect(0,0,w,h);
      const list=document.getElementById('logList');
      if(logs.length===0){list.innerHTML='<div class="empty-state" style="padding:20px 0;">暂无记录</div>';return;}
      const recent=logs.slice(-10).reverse();
      list.innerHTML=recent.map(l=>`<li class="log-item"><div class="log-date">${l.date}</div>${l.duration}分钟 · ${l.weight}kg · 腰${l.waist}cm · ${l.stage}</li>`).join('');
      if(logs.length<2){ctx.fillStyle='#d4d4d4';ctx.font='12px sans-serif';ctx.textAlign='center';ctx.fillText('记录2次以上显示趋势',w/2,h/2);return;}
      const last10=logs.slice(-10);
      const weights=last10.map(l=>+l.weight), waists=last10.map(l=>+l.waist);
      const all=[...weights,...waists],min=Math.min(...all)-2,max=Math.max(...all)+2;
      const pad={t:20,b:20,l:35,r:15},cw=w-pad.l-pad.r,ch=h-pad.t-pad.b;
      const xs=cw/(last10.length-1),ys=ch/(max-min);
      ctx.strokeStyle='#ebebeb';ctx.lineWidth=.5;ctx.setLineDash([]);
      for(let i=0;i<5;i++){const y=pad.t+ch/5*i;ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(w-pad.r,y);ctx.stroke();}
      function drawLine(data,color,dash){
        ctx.beginPath();ctx.strokeStyle=color;ctx.lineWidth=2;
        ctx.setLineDash(dash?[4,4]:[]);
        data.forEach((v,i)=>{const x=pad.l+i*xs,y=pad.t+ch-(v-min)*ys;(i?ctx.lineTo:ctx.moveTo).call(ctx,x,y);});ctx.stroke();
      }
      drawLine(weights,'#0a0a0a',false);drawLine(waists,'#a3a3a3',true);
      ctx.fillStyle='#737373';ctx.font='10px sans-serif';ctx.textAlign='center';
      last10.forEach((l,i)=>{const lbl=(l.date||'').slice(5);ctx.fillText(lbl,pad.l+i*xs,h-4);});
    }
    updateChart();
  </script>
</body>

      <div class="form-row">
        <div class="form-group">
          <label>状态(1-5)</label>
          <input type="number" id="energy" placeholder="3" min="1" max="5">
        </div>
        <div class="form-group">
          <label>时长(分钟)</label>
          <input type="number" id="duration" placeholder="30" min="5">
        </div>
      </div>
      <div class="form-group">
        <label>阶段</label>
        <select id="stage">
          <option value="新手">新手 — 低强度入门</option>
          <option value="适应" selected>适应 — 中等强度</option>
          <option value="提升">提升 — 高强度挑战</option>
        </select>
      </div>
      <button class="btn-primary" id="genPlanBtn">生成方案</button>
      <div class="plan-result" id="planResult">
        <div id="planContent"></div>
      </div>
    </div>

    <!-- 记录页 -->
    <div class="page" id="page-record">
      <div class="section-title">身体数据趋势</div>
      <div class="chart-box"><canvas id="trendChart"></canvas></div>
      <div class="section-title">运动日志</div>
      <ul class="log-list" id="logList"></ul>
    </div>
  </div>

  <div class="tab-bar">
    <div class="tab-item active" data-page="learn"><span class="ti">📖</span>学习</div>
    <div class="tab-item" data-page="workout"><span class="ti">🏃</span>运动</div>
    <div class="tab-item" data-page="record"><span class="ti">📊</span>记录</div>
  </div>

  <script>
    // 日期
    document.getElementById('todayDate').textContent = new Date().toLocaleDateString('zh-CN',{month:'short',day:'numeric',weekday:'short'});

    // Tab
    document.querySelectorAll('.tab-item').forEach(t=>{
      t.addEventListener('click',function(){
        document.querySelectorAll('.tab-item').forEach(x=>x.classList.remove('active'));
        this.classList.add('active');
        document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
        document.getElementById('page-'+this.dataset.page).classList.add('active');
        if(this.dataset.page==='record') setTimeout(updateChart,100);
      });
    });

    // 加载知识点
    fetch('data.json?t='+Date.now()).then(r=>r.json()).then(data=>{
      const container=document.getElementById('knowledgeContainer');
      document.getElementById('updateTime').textContent='更新于 '+data.updated_at;
      if(!data.articles||data.articles.length===0){
        container.innerHTML='<div class="empty-state"><div class="es-icon">📭</div><div>今日暂无更新</div></div>';
        return;
      }
      container.innerHTML=data.articles.map((a,i)=>`
        <div class="knowledge-card">
          <div class="card-header">
            <span class="card-tag">${a.category}</span>
            <span class="card-progress">${i+1}/${data.articles.length}</span>
          </div>
          <div class="card-title">${a.title}</div>
          <div class="card-body">${a.content}</div>
          <div class="card-footer">
            <span class="card-source">来源：${a.source||'AI整理'}</span>
            <div class="card-actions">
              <button onclick="this.textContent=this.textContent==='👍'?'已赞':'👍'">👍</button>
              <button onclick="navigator.clipboard.writeText('${a.title}').then(()=>alert('已复制'))">📋</button>
            </div>
          </div>
        </div>
      `).join('');
    }).catch(()=>{
      document.getElementById('knowledgeContainer').innerHTML='<div class="empty-state"><div class="es-icon">⚠️</div><div>加载失败，请检查网络</div></div>';
    });

    // 运动方案
    const planMap={
      '新手':{w:'原地踏步3min + 肩颈环绕2min',m:'靠墙静蹲30s×3\n坐姿抬腿15次×3\n跪姿俯卧撑8次×3',s:'大腿前侧拉伸30s×2\n小腿拉伸30s×2',kw:'无跑跳燃脂站立'},
      '适应':{w:'开合跳(无跳)30次 + 手臂画圈1min',m:'深蹲15次×3\n平板支撑30s×3\n臀桥15次×3',s:'蝴蝶式30s×2\n猫牛式10次\n婴儿式30s',kw:'低冲击有氧跟练'},
      '提升':{w:'弓步压腿每侧10次 + 动态伸展2min',m:'保加利亚分腿蹲每侧10次×3\n俯身划船(弹力带)15次×3\n波比跳(无跳)10次×3',s:'鸽子式30s×2\n腘绳肌拉伸30s×2',kw:'站立HIIT低冲击'}
    };
    document.getElementById('genPlanBtn').addEventListener('click',function(){
      const w=document.getElementById('weight').value.trim();
      const wa=document.getElementById('waist').value.trim();
      const e=document.getElementById('energy').value.trim();
      const d=document.getElementById('duration').value.trim();
      const st=document.getElementById('stage').value;
      if(!w||!wa||!e||!d){alert('请填写完整');return;}
      const logs=JSON.parse(localStorage.getItem('workout_logs')||'[]');
      const now=new Date();
      logs.push({date:now.getFullYear()+'.'+String(now.getMonth()+1).padStart(2,'0')+'.'+String(now.getDate()).padStart(2,'0'),weight:w,waist:wa,energy:e,duration:d,stage:st});
      localStorage.setItem('workout_logs',JSON.stringify(logs));
      const p=planMap[st]||planMap['适应'];
      const sets=Math.max(1,Math.min(4,Math.floor(d/15)));
      const mainAdj=p.m.replace(/×\d+/g,'×'+sets);
      document.getElementById('planContent').innerHTML=`
        <div class="plan-phase"><div class="pn">🔥 热身</div><div class="pd">${p.w}</div></div>
        <div class="plan-phase"><div class="pn">💪 主训练</div><div class="pd">${mainAdj.replace(/\n/g,'<br>')}</div></div>
        <div class="plan-phase"><div class="pn">🧘 拉伸</div><div class="pd">${p.s.replace(/\n/g,'<br>')}</div></div>
        <div class="plan-phase"><div class="pn">🔍 B站搜索</div><div class="pd"><a href="https://search.bilibili.com/all?keyword=${encodeURIComponent(p.kw)}" target="_blank">${p.kw}</a></div></div>
      `;
      document.getElementById('planResult').classList.add('show');
      updateChart();
    });

    // 图表
    function updateChart(){
      const logs=JSON.parse(localStorage.getItem('workout_logs')||'[]');
      const canvas=document.getElementById('trendChart');
      const ctx=canvas.getContext('2d');
      const rect=canvas.parentElement.getBoundingClientRect();
      canvas.width=rect.width*2; canvas.height=rect.height*2;
      canvas.style.width=rect.width+'px'; canvas.style.height=rect.height+'px';
      ctx.scale(2,2);
      const w=rect.width,h=rect.height;
      ctx.clearRect(0,0,w,h);
      const list=document.getElementById('logList');
      if(logs.length===0){list.innerHTML='<div class="empty-state" style="padding:20px 0;">暂无记录</div>';return;}
      const recent=logs.slice(-10).reverse();
      list.innerHTML=recent.map(l=>`<li class="log-item"><div class="log-date">${l.date}</div>${l.duration}分钟 · ${l.weight}kg · 腰${l.waist}cm · ${l.stage}</li>`).join('');
      if(logs.length<2){ctx.fillStyle='#d4d4d4';ctx.font='12px sans-serif';ctx.textAlign='center';ctx.fillText('记录2次以上显示趋势',w/2,h/2);return;}
      const last10=logs.slice(-10);
      const weights=last10.map(l=>+l.weight), waists=last10.map(l=>+l.waist);
      const all=[...weights,...waists],min=Math.min(...all)-2,max=Math.max(...all)+2;
      const pad={t:20,b:20,l:35,r:15},cw=w-pad.l-pad.r,ch=h-pad.t-pad.b;
      const xs=cw/(last10.length-1),ys=ch/(max-min);
      ctx.strokeStyle='#ebebeb';ctx.lineWidth=.5;ctx.setLineDash([]);
      for(let i=0;i<5;i++){const y=pad.t+ch/5*i;ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(w-pad.r,y);ctx.stroke();}
      function drawLine(data,color,dash){
        ctx.beginPath();ctx.strokeStyle=color;ctx.lineWidth=2;
        ctx.setLineDash(dash?[4,4]:[]);
        data.forEach((v,i)=>{const x=pad.l+i*xs,y=pad.t+ch-(v-min)*ys;(i?ctx.lineTo:ctx.moveTo).call(ctx,x,y);});ctx.stroke();
      }
      drawLine(weights,'#0a0a0a',false);drawLine(waists,'#a3a3a3',true);
      ctx.fillStyle='#737373';ctx.font='10px sans-serif';ctx.textAlign='center';
      last10.forEach((l,i)=>{const lbl=(l.date||'').slice(5);ctx.fillText(lbl,pad.l+i*xs,h-4);});
    }
    updateChart();
  </script>
</body>
</html>
